version: '3.8'

services:
  minmax_octopus_bot:
    container_name: MinMaxOctopusBot
    image: eelmafia/octopus-minmax-bot
    restart: unless-stopped
    ports:
      - "5050:5050"
    volumes:
      - ./logs:/app/logs
    environment:
      - TZ=Europe/London
      - ACC_NUMBER=<your_account_number>
      - API_KEY=<your_api_key>
      - EXECUTION_TIME=23:00
      - SWITCH_THRESHOLD=2
      - NOTIFICATION_URLS=<your_apprise_notification_urls>
      - ONE_OFF=false
      - DRY_RUN=false
      - TARIFFS=cosy-fix,cosy,agile,go,flexible
      # Read today's usage from Home Assistant instead of the Octopus Home Mini feed
      - CONSUMPTION_SOURCE=homeassistant
      - HA_URL=https://your-home-assistant:8123/api
      - HA_TOKEN=<your_long_lived_access_token>
      - HA_IMPORT_ENTITY=sensor.givtcp_ch2315g326_import_energy_total_kwh
      - WEB_USERNAME=admin
      - WEB_PASSWORD=admin # not meant to be secure
