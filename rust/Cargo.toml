[package]
name = "octo-minmax"
version = "1.2.0"
edition = "2021"
description = "Octopus MinMax Bot - a Rust rewrite of the Octopus Energy tariff min/max bot"
license = "MIT"

[[bin]]
name = "octo-minmax"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
flate2 = { version = "1", features = ["zlib"] }
sha1 = "0.10"
hmac = "0.12"
base64 = "0.22"
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
webpki-roots = "0.26"
fancy-regex = "0.14"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
